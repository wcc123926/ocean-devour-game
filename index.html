<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>海底吞噬成长游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }

        .game-container {
            position: relative;
            border-radius: 10px;
            box-shadow: 0 0 30px rgba(0, 200, 255, 0.3);
            overflow: hidden;
        }

        #gameCanvas {
            display: block;
            background: linear-gradient(180deg, #0077be 0%, #003d66 50%, #001a2e 100%);
        }

        .ui-panel {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            pointer-events: none;
            z-index: 10;
        }

        .stats-panel {
            background: rgba(0, 0, 0, 0.6);
            border-radius: 8px;
            padding: 10px 15px;
            color: white;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(0, 200, 255, 0.3);
        }

        .stat-item {
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .stat-label {
            color: #64b5f6;
            font-size: 12px;
        }

        .stat-value {
            color: #fff;
            font-weight: bold;
            font-size: 14px;
        }

        .progress-bar-container {
            width: 150px;
            height: 12px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 6px;
            overflow: hidden;
            margin-top: 5px;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #00c853, #64dd17);
            border-radius: 6px;
            transition: width 0.3s ease;
        }

        .powerups-panel {
            display: flex;
            gap: 10px;
        }

        .powerup-indicator {
            background: rgba(0, 0, 0, 0.6);
            border-radius: 8px;
            padding: 8px;
            min-width: 60px;
            text-align: center;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        .powerup-indicator.active {
            border-color: rgba(255, 215, 0, 0.8);
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
        }

        .powerup-icon {
            font-size: 20px;
            margin-bottom: 3px;
        }

        .powerup-name {
            font-size: 10px;
            color: #90caf9;
        }

        .powerup-duration {
            font-size: 11px;
            color: #fff;
            font-weight: bold;
        }

        .game-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            backdrop-filter: blur(5px);
        }

        .game-overlay.hidden {
            display: none;
        }

        .overlay-title {
            font-size: 48px;
            color: #64b5f6;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(100, 181, 246, 0.5);
        }

        .overlay-subtitle {
            font-size: 24px;
            color: #fff;
            margin-bottom: 30px;
        }

        .score-display {
            font-size: 36px;
            color: #ffd700;
            margin-bottom: 40px;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
        }

        .game-button {
            background: linear-gradient(135deg, #64b5f6 0%, #1976d2 100%);
            border: none;
            color: white;
            padding: 15px 40px;
            font-size: 18px;
            border-radius: 30px;
            cursor: pointer;
            margin: 10px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(100, 181, 246, 0.4);
            pointer-events: auto;
        }

        .game-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(100, 181, 246, 0.6);
        }

        .game-button:active {
            transform: translateY(0);
        }

        .game-button.secondary {
            background: linear-gradient(135deg, #78909c 0%, #546e7a 100%);
            box-shadow: 0 4px 15px rgba(120, 144, 156, 0.4);
        }

        .game-button.secondary:hover {
            box-shadow: 0 6px 20px rgba(120, 144, 156, 0.6);
        }

        .pause-indicator {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 36px;
            color: #fff;
            background: rgba(0, 0, 0, 0.7);
            padding: 20px 40px;
            border-radius: 10px;
            z-index: 50;
            pointer-events: none;
        }

        .pause-indicator.hidden {
            display: none;
        }

        .instructions {
            color: #90caf9;
            font-size: 14px;
            margin-top: 30px;
            text-align: center;
            line-height: 1.6;
        }

        .controls-hint {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.6);
            font-size: 12px;
            pointer-events: none;
        }

        .growth-effect {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 255, 100, 0.8) 0%, rgba(0, 255, 100, 0) 70%);
            pointer-events: none;
            animation: growPulse 0.5s ease-out forwards;
        }

        @keyframes growPulse {
            0% { transform: scale(0.5); opacity: 1; }
            100% { transform: scale(2); opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <canvas id="gameCanvas" width="1000" height="700"></canvas>
        
        <div class="ui-panel">
            <div class="stats-panel">
                <div class="stat-item">
                    <span class="stat-label">分数:</span>
                    <span class="stat-value" id="scoreValue">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">体型阶段:</span>
                    <span class="stat-value" id="stageValue">1 - 幼鱼</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">下一阶段进度:</span>
                </div>
                <div class="progress-bar-container">
                    <div class="progress-bar" id="progressBar" style="width: 0%"></div>
                </div>
            </div>
            
            <div class="powerups-panel">
                <div class="powerup-indicator" id="speedIndicator">
                    <div class="powerup-icon">⚡</div>
                    <div class="powerup-name">加速</div>
                    <div class="powerup-duration" id="speedDuration">--</div>
                </div>
                <div class="powerup-indicator" id="shieldIndicator">
                    <div class="powerup-icon">🛡️</div>
                    <div class="powerup-name">护盾</div>
                    <div class="powerup-duration" id="shieldDuration">--</div>
                </div>
            </div>
        </div>

        <div class="pause-indicator hidden" id="pauseIndicator">游戏暂停</div>

        <div class="game-overlay" id="startOverlay">
            <div class="overlay-title">🐟 海底吞噬成长</div>
            <div class="overlay-subtitle">成为海洋之王！</div>
            <div class="instructions">
                吃掉比你小的鱼来成长<br>
                躲避比你大的鱼<br>
                收集道具获得加成<br><br>
                <strong>操作方式:</strong> 鼠标移动控制方向，点击加速
            </div>
            <button class="game-button" id="startButton">开始游戏</button>
        </div>

        <div class="game-overlay hidden" id="pauseOverlay">
            <div class="overlay-title">⏸️ 游戏暂停</div>
            <button class="game-button" id="resumeButton">继续游戏</button>
            <button class="game-button secondary" id="pauseRestartButton">重新开始</button>
        </div>

        <div class="game-overlay hidden" id="gameOverOverlay">
            <div class="overlay-title">💀 游戏结束</div>
            <div class="overlay-subtitle">你被更大的鱼吃掉了！</div>
            <div class="score-display">最终分数: <span id="finalScore">0</span></div>
            <button class="game-button" id="restartButton">再来一次</button>
        </div>

        <div class="controls-hint">
            按 ESC 暂停游戏 | 鼠标移动控制方向 | 点击加速
        </div>
    </div>

    <script>
        // 游戏配置
        const CONFIG = {
            canvasWidth: 1000,
            canvasHeight: 700,
            playerBaseSize: 25,
            playerBaseSpeed: 3,
            playerMaxSize: 120,
            maxEnemyFish: 15,
            maxPowerups: 3,
            speedBoostMultiplier: 1.8,
            speedBoostDuration: 8000,
            shieldDuration: 10000,
            growthStages: [
                { name: '幼鱼', minSize: 25, maxSize: 35, scorePerFish: 10 },
                { name: '小鱼', minSize: 35, maxSize: 50, scorePerFish: 15 },
                { name: '中鱼', minSize: 50, maxSize: 70, scorePerFish: 20 },
                { name: '大鱼', minSize: 70, maxSize: 90, scorePerFish: 30 },
                { name: '巨型鱼', minSize: 90, maxSize: 120, scorePerFish: 50 }
            ],
            stageRequirements: [0, 100, 300, 600, 1000]
        };

        // 游戏状态
        const GameState = {
            START: 'start',
            PLAYING: 'playing',
            PAUSED: 'paused',
            GAME_OVER: 'gameOver'
        };

        // 游戏类
        class Game {
            constructor() {
                this.canvas = document.getElementById('gameCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.state = GameState.START;
                this.score = 0;
                this.player = null;
                this.enemyFish = [];
                this.powerups = [];
                this.particles = [];
                this.keys = {};
                this.mouse = { x: CONFIG.canvasWidth / 2, y: CONFIG.canvasHeight / 2 };
                this.lastTime = 0;
                this.animationId = null;
                this.backgroundElements = [];
                
                this.initBackground();
                this.bindEvents();
                this.updateUI();
            }

            initBackground() {
                // 初始化背景气泡和海草
                this.backgroundElements = {
                    bubbles: [],
                    seaweed: []
                };

                // 创建海草
                for (let i = 0; i < 15; i++) {
                    this.backgroundElements.seaweed.push({
                        x: Math.random() * CONFIG.canvasWidth,
                        y: CONFIG.canvasHeight - Math.random() * 100,
                        height: 50 + Math.random() * 100,
                        width: 3 + Math.random() * 3,
                        sway: Math.random() * Math.PI * 2,
                        swaySpeed: 0.02 + Math.random() * 0.02
                    });
                }

                // 创建初始气泡
                for (let i = 0; i < 20; i++) {
                    this.backgroundElements.bubbles.push({
                        x: Math.random() * CONFIG.canvasWidth,
                        y: Math.random() * CONFIG.canvasHeight,
                        radius: 1 + Math.random() * 3,
                        speed: 0.5 + Math.random() * 1,
                        sway: Math.random() * Math.PI * 2
                    });
                }
            }

            bindEvents() {
                // 鼠标移动
                this.canvas.addEventListener('mousemove', (e) => {
                    const rect = this.canvas.getBoundingClientRect();
                    this.mouse.x = e.clientX - rect.left;
                    this.mouse.y = e.clientY - rect.top;
                });

                // 鼠标点击加速
                this.canvas.addEventListener('click', (e) => {
                    if (this.state === GameState.PLAYING && this.player) {
                        this.player.boost();
                    }
                });

                // 键盘事件
                document.addEventListener('keydown', (e) => {
                    this.keys[e.key] = true;
                    
                    if (e.key === 'Escape') {
                        if (this.state === GameState.PLAYING) {
                            this.pause();
                        } else if (this.state === GameState.PAUSED) {
                            this.resume();
                        }
                    }
                });

                document.addEventListener('keyup', (e) => {
                    this.keys[e.key] = false;
                });

                // 按钮事件
                document.getElementById('startButton').addEventListener('click', () => this.start());
                document.getElementById('resumeButton').addEventListener('click', () => this.resume());
                document.getElementById('restartButton').addEventListener('click', () => this.restart());
                document.getElementById('pauseRestartButton').addEventListener('click', () => this.restart());
            }

            start() {
                this.state = GameState.PLAYING;
                this.score = 0;
                this.enemyFish = [];
                this.powerups = [];
                this.particles = [];
                
                // 创建玩家
                this.player = new Player(
                    CONFIG.canvasWidth / 2,
                    CONFIG.canvasHeight / 2,
                    CONFIG.playerBaseSize
                );

                // 隐藏开始界面
                document.getElementById('startOverlay').classList.add('hidden');
                document.getElementById('gameOverOverlay').classList.add('hidden');
                document.getElementById('pauseOverlay').classList.add('hidden');

                // 启动游戏循环
                this.lastTime = performance.now();
                this.gameLoop();
            }

            pause() {
                if (this.state !== GameState.PLAYING) return;
                this.state = GameState.PAUSED;
                document.getElementById('pauseIndicator').classList.remove('hidden');
                document.getElementById('pauseOverlay').classList.remove('hidden');
                cancelAnimationFrame(this.animationId);
            }

            resume() {
                if (this.state !== GameState.PAUSED) return;
                this.state = GameState.PLAYING;
                document.getElementById('pauseIndicator').classList.add('hidden');
                document.getElementById('pauseOverlay').classList.add('hidden');
                this.lastTime = performance.now();
                this.gameLoop();
            }

            restart() {
                this.start();
            }

            gameOver() {
                this.state = GameState.GAME_OVER;
                cancelAnimationFrame(this.animationId);
                
                document.getElementById('finalScore').textContent = this.score;
                document.getElementById('gameOverOverlay').classList.remove('hidden');
            }

            gameLoop(currentTime = performance.now()) {
                const deltaTime = (currentTime - this.lastTime) / 1000;
                this.lastTime = currentTime;

                this.update(deltaTime);
                this.render();

                this.animationId = requestAnimationFrame((time) => this.gameLoop(time));
            }

            update(deltaTime) {
                if (this.state !== GameState.PLAYING) return;

                // 更新背景元素
                this.updateBackground(deltaTime);

                // 更新玩家
                this.player.update(deltaTime, this.mouse, this.canvas);

                // 生成敌人鱼
                this.spawnEnemyFish();

                // 生成道具
                this.spawnPowerups();

                // 更新敌人鱼
                this.enemyFish.forEach((fish, index) => {
                    fish.update(deltaTime, this.canvas);
                    
                    // 移除出界的鱼
                    if (fish.isOutOfBounds(this.canvas)) {
                        this.enemyFish.splice(index, 1);
                    }
                });

                // 更新道具
                this.powerups.forEach((powerup, index) => {
                    powerup.update(deltaTime);
                    
                    // 移除过期道具
                    if (powerup.lifetime <= 0) {
                        this.powerups.splice(index, 1);
                    }
                });

                // 更新粒子
                this.particles.forEach((particle, index) => {
                    particle.update(deltaTime);
                    if (particle.lifetime <= 0) {
                        this.particles.splice(index, 1);
                    }
                });

                // 碰撞检测
                this.checkCollisions();

                // 更新UI
                this.updateUI();
            }

            updateBackground(deltaTime) {
                // 更新气泡
                this.backgroundElements.bubbles.forEach(bubble => {
                    bubble.y -= bubble.speed;
                    bubble.sway += 0.05;
                    bubble.x += Math.sin(bubble.sway) * 0.3;
                    
                    if (bubble.y < -10) {
                        bubble.y = CONFIG.canvasHeight + 10;
                        bubble.x = Math.random() * CONFIG.canvasWidth;
                    }
                });

                // 更新海草摆动
                this.backgroundElements.seaweed.forEach(seaweed => {
                    seaweed.sway += seaweed.swaySpeed;
                });
            }

            spawnEnemyFish() {
                if (this.enemyFish.length >= CONFIG.maxEnemyFish) return;

                // 基于玩家体型生成不同大小的鱼
                const playerSize = this.player.size;
                const sizes = [];
                
                // 70% 生成比玩家小或差不多的鱼
                for (let i = 0; i < 7; i++) {
                    sizes.push(playerSize * (0.5 + Math.random() * 0.7));
                }
                
                // 30% 生成比玩家大的鱼
                for (let i = 0; i < 3; i++) {
                    sizes.push(playerSize * (1.1 + Math.random() * 1.5));
                }

                const fishSize = sizes[Math.floor(Math.random() * sizes.length)];
                
                // 从屏幕边缘生成
                const edge = Math.floor(Math.random() * 4);
                let x, y, direction;

                switch (edge) {
                    case 0: // 左边
                        x = -fishSize * 2;
                        y = Math.random() * CONFIG.canvasHeight;
                        direction = Math.random() * Math.PI * 0.5 - Math.PI * 0.25;
                        break;
                    case 1: // 右边
                        x = CONFIG.canvasWidth + fishSize * 2;
                        y = Math.random() * CONFIG.canvasHeight;
                        direction = Math.PI + Math.random() * Math.PI * 0.5 - Math.PI * 0.25;
                        break;
                    case 2: // 上边
                        x = Math.random() * CONFIG.canvasWidth;
                        y = -fishSize * 2;
                        direction = Math.PI * 0.5 + Math.random() * Math.PI * 0.5 - Math.PI * 0.25;
                        break;
                    case 3: // 下边
                        x = Math.random() * CONFIG.canvasWidth;
                        y = CONFIG.canvasHeight + fishSize * 2;
                        direction = -Math.PI * 0.5 + Math.random() * Math.PI * 0.5 - Math.PI * 0.25;
                        break;
                }

                this.enemyFish.push(new EnemyFish(x, y, fishSize, direction));
            }

            spawnPowerups() {
                if (this.powerups.length >= CONFIG.maxPowerups) return;
                if (Math.random() > 0.005) return; // 低概率生成

                const x = 100 + Math.random() * (CONFIG.canvasWidth - 200);
                const y = 100 + Math.random() * (CONFIG.canvasHeight - 200);
                const type = Math.random() > 0.5 ? 'speed' : 'shield';

                this.powerups.push(new Powerup(x, y, type));
            }

            checkCollisions() {
                // 玩家与敌人鱼碰撞
                this.enemyFish.forEach((fish, fishIndex) => {
                    if (this.player.collidesWith(fish)) {
                        const sizeRatio = fish.size / this.player.size;
                        
                        if (sizeRatio < 0.85) {
                            // 吃掉小鱼
                            this.eatFish(fish, fishIndex);
                        } else if (sizeRatio > 1.15) {
                            // 碰到大鱼
                            if (this.player.hasShield) {
                                // 有护盾，消耗护盾
                                this.player.shieldDuration = 0;
                                this.player.hasShield = false;
                                this.enemyFish.splice(fishIndex, 1);
                                this.createParticles(fish.x, fish.y, '#ff6b6b', 10);
                            } else {
                                // 没有护盾，游戏结束
                                this.gameOver();
                            }
                        }
                        // 差不多大小的鱼互相穿过
                    }
                });

                // 玩家与道具碰撞
                this.powerups.forEach((powerup, index) => {
                    if (this.player.collidesWith(powerup)) {
                        this.collectPowerup(powerup, index);
                    }
                });
            }

            eatFish(fish, index) {
                // 增加分数
                const stage = this.getCurrentStage();
                const points = stage.scorePerFish;
                this.score += points;

                // 增加体型
                const growthAmount = fish.size * 0.15;
                const newSize = Math.min(this.player.size + growthAmount, CONFIG.playerMaxSize);
                this.player.grow(newSize);

                // 创建粒子效果
                this.createParticles(fish.x, fish.y, '#4caf50', 8);

                // 移除被吃的鱼
                this.enemyFish.splice(index, 1);

                // 添加成长反馈
                this.showGrowthEffect();
            }

            collectPowerup(powerup, index) {
                if (powerup.type === 'speed') {
                    this.player.speedBoostDuration = CONFIG.speedBoostDuration;
                    this.player.hasSpeedBoost = true;
                } else if (powerup.type === 'shield') {
                    this.player.shieldDuration = CONFIG.shieldDuration;
                    this.player.hasShield = true;
                }

                this.createParticles(powerup.x, powerup.y, 
                    powerup.type === 'speed' ? '#ffd700' : '#64b5f6', 12);
                
                this.powerups.splice(index, 1);
            }

            createParticles(x, y, color, count) {
                for (let i = 0; i < count; i++) {
                    this.particles.push(new Particle(x, y, color));
                }
            }

            showGrowthEffect() {
                // 可以在这里添加屏幕震动等效果
            }

            getCurrentStage() {
                const size = this.player ? this.player.size : CONFIG.playerBaseSize;
                for (let i = CONFIG.growthStages.length - 1; i >= 0; i--) {
                    if (size >= CONFIG.growthStages[i].minSize) {
                        return { ...CONFIG.growthStages[i], index: i };
                    }
                }
                return { ...CONFIG.growthStages[0], index: 0 };
            }

            getProgress() {
                const stage = this.getCurrentStage();
                const nextStageIndex = Math.min(stage.index + 1, CONFIG.growthStages.length - 1);
                
                if (stage.index === nextStageIndex) return 100;

                const currentMin = CONFIG.growthStages[stage.index].minSize;
                const nextMin = CONFIG.growthStages[nextStageIndex].minSize;
                const currentSize = this.player ? this.player.size : CONFIG.playerBaseSize;

                const progress = ((currentSize - currentMin) / (nextMin - currentMin)) * 100;
                return Math.max(0, Math.min(100, progress));
            }

            updateUI() {
                // 更新分数
                document.getElementById('scoreValue').textContent = this.score;

                // 更新体型阶段
                const stage = this.getCurrentStage();
                document.getElementById('stageValue').textContent = `${stage.index + 1} - ${stage.name}`;

                // 更新进度条
                const progress = this.getProgress();
                document.getElementById('progressBar').style.width = `${progress}%`;

                // 更新道具状态
                if (this.player) {
                    // 加速状态
                    const speedIndicator = document.getElementById('speedIndicator');
                    const speedDuration = document.getElementById('speedDuration');
                    
                    if (this.player.hasSpeedBoost) {
                        speedIndicator.classList.add('active');
                        speedDuration.textContent = `${Math.ceil(this.player.speedBoostDuration / 1000)}s`;
                    } else {
                        speedIndicator.classList.remove('active');
                        speedDuration.textContent = '--';
                    }

                    // 护盾状态
                    const shieldIndicator = document.getElementById('shieldIndicator');
                    const shieldDuration = document.getElementById('shieldDuration');
                    
                    if (this.player.hasShield) {
                        shieldIndicator.classList.add('active');
                        shieldDuration.textContent = `${Math.ceil(this.player.shieldDuration / 1000)}s`;
                    } else {
                        shieldIndicator.classList.remove('active');
                        shieldDuration.textContent = '--';
                    }
                }
            }

            render() {
                // 清空画布
                this.ctx.clearRect(0, 0, CONFIG.canvasWidth, CONFIG.canvasHeight);

                // 绘制背景
                this.drawBackground();

                // 绘制道具
                this.powerups.forEach(powerup => powerup.render(this.ctx));

                // 绘制敌人鱼
                this.enemyFish.forEach(fish => fish.render(this.ctx));

                // 绘制玩家
                if (this.player) {
                    this.player.render(this.ctx);
                }

                // 绘制粒子
                this.particles.forEach(particle => particle.render(this.ctx));
            }

            drawBackground() {
                // 绘制海草
                this.ctx.save();
                this.backgroundElements.seaweed.forEach(seaweed => {
                    this.ctx.beginPath();
                    this.ctx.moveTo(seaweed.x, seaweed.y);
                    
                    const swayAmount = Math.sin(seaweed.sway) * 15;
                    this.ctx.quadraticCurveTo(
                        seaweed.x + swayAmount,
                        seaweed.y - seaweed.height * 0.5,
                        seaweed.x + swayAmount * 0.5,
                        seaweed.y - seaweed.height
                    );
                    
                    this.ctx.strokeStyle = '#1b5e20';
                    this.ctx.lineWidth = seaweed.width;
                    this.ctx.lineCap = 'round';
                    this.ctx.stroke();
                });
                this.ctx.restore();

                // 绘制气泡
                this.ctx.save();
                this.backgroundElements.bubbles.forEach(bubble => {
                    this.ctx.beginPath();
                    this.ctx.arc(bubble.x, bubble.y, bubble.radius, 0, Math.PI * 2);
                    this.ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
                    this.ctx.fill();
                    
                    // 气泡高光
                    this.ctx.beginPath();
                    this.ctx.arc(
                        bubble.x - bubble.radius * 0.3,
                        bubble.y - bubble.radius * 0.3,
                        bubble.radius * 0.3,
                        0, Math.PI * 2
                    );
                    this.ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
                    this.ctx.fill();
                });
                this.ctx.restore();

                // 绘制海底沙子
                const gradient = this.ctx.createLinearGradient(0, CONFIG.canvasHeight - 50, 0, CONFIG.canvasHeight);
                gradient.addColorStop(0, 'rgba(139, 119, 101, 0.3)');
                gradient.addColorStop(1, 'rgba(139, 119, 101, 0.6)');
                this.ctx.fillStyle = gradient;
                this.ctx.fillRect(0, CONFIG.canvasHeight - 50, CONFIG.canvasWidth, 50);
            }
        }

        // 玩家类
        class Player {
            constructor(x, y, size) {
                this.x = x;
                this.y = y;
                this.size = size;
                this.baseSpeed = CONFIG.playerBaseSpeed;
                this.speed = this.baseSpeed;
                this.direction = 0;
                this.hasSpeedBoost = false;
                this.speedBoostDuration = 0;
                this.hasShield = false;
                this.shieldDuration = 0;
                this.boostCooldown = 0;
                this.tailWag = 0;
            }

            update(deltaTime, mouse, canvas) {
                // 更新道具持续时间
                if (this.speedBoostDuration > 0) {
                    this.speedBoostDuration -= deltaTime * 1000;
                    if (this.speedBoostDuration <= 0) {
                        this.hasSpeedBoost = false;
                        this.speedBoostDuration = 0;
                    }
                }

                if (this.shieldDuration > 0) {
                    this.shieldDuration -= deltaTime * 1000;
                    if (this.shieldDuration <= 0) {
                        this.hasShield = false;
                        this.shieldDuration = 0;
                    }
                }

                // 更新加速冷却
                if (this.boostCooldown > 0) {
                    this.boostCooldown -= deltaTime * 1000;
                }

                // 计算朝向
                const dx = mouse.x - this.x;
                const dy = mouse.y - this.y;
                const targetAngle = Math.atan2(dy, dx);

                // 平滑转向
                let angleDiff = targetAngle - this.direction;
                while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
                while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
                this.direction += angleDiff * 0.1;

                // 计算速度
                let currentSpeed = this.baseSpeed;
                
                // 体型越大速度越慢（但有最小速度）
                const sizePenalty = 1 - (this.size - CONFIG.playerBaseSize) / CONFIG.playerMaxSize * 0.3;
                currentSpeed *= Math.max(0.5, sizePenalty);

                // 加速加成
                if (this.hasSpeedBoost) {
                    currentSpeed *= CONFIG.speedBoostMultiplier;
                }

                // 移动
                const distance = Math.sqrt(dx * dx + dy * dy);
                if (distance > 5) {
                    this.x += Math.cos(this.direction) * currentSpeed;
                    this.y += Math.sin(this.direction) * currentSpeed;
                }

                // 边界限制
                this.x = Math.max(this.size, Math.min(canvas.width - this.size, this.x));
                this.y = Math.max(this.size, Math.min(canvas.height - this.size, this.y));

                // 尾巴摆动
                this.tailWag += 0.2;
            }

            boost() {
                if (this.boostCooldown > 0) return;
                
                // 短时间加速冲刺
                this.boostCooldown = 1000;
                // 可以在这里添加冲刺效果
            }

            grow(newSize) {
                this.size = newSize;
            }

            collidesWith(object) {
                const dx = this.x - object.x;
                const dy = this.y - object.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                const minDistance = (this.size + object.size) * 0.8;
                return distance < minDistance;
            }

            render(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.direction);

                // 绘制护盾
                if (this.hasShield) {
                    ctx.beginPath();
                    ctx.arc(0, 0, this.size * 1.3, 0, Math.PI * 2);
                    const shieldGradient = ctx.createRadialGradient(0, 0, this.size, 0, 0, this.size * 1.3);
                    shieldGradient.addColorStop(0, 'rgba(100, 181, 246, 0)');
                    shieldGradient.addColorStop(0.7, 'rgba(100, 181, 246, 0.3)');
                    shieldGradient.addColorStop(1, 'rgba(100, 181, 246, 0.6)');
                    ctx.fillStyle = shieldGradient;
                    ctx.fill();
                    
                    // 护盾边缘光
                    ctx.strokeStyle = 'rgba(100, 181, 246, 0.8)';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                }

                // 加速效果
                if (this.hasSpeedBoost) {
                    // 尾迹
                    ctx.beginPath();
                    ctx.moveTo(-this.size * 0.5, 0);
                    ctx.lineTo(-this.size * 1.5, -this.size * 0.3);
                    ctx.lineTo(-this.size * 1.5, this.size * 0.3);
                    ctx.closePath();
                    ctx.fillStyle = 'rgba(255, 215, 0, 0.3)';
                    ctx.fill();
                }

                // 鱼身体
                const bodyGradient = ctx.createRadialGradient(
                    -this.size * 0.2, -this.size * 0.2, 0,
                    0, 0, this.size
                );
                bodyGradient.addColorStop(0, '#64b5f6');
                bodyGradient.addColorStop(0.7, '#1976d2');
                bodyGradient.addColorStop(1, '#0d47a1');

                ctx.beginPath();
                ctx.ellipse(0, 0, this.size * 0.8, this.size * 0.5, 0, 0, Math.PI * 2);
                ctx.fillStyle = bodyGradient;
                ctx.fill();
                ctx.strokeStyle = '#0d47a1';
                ctx.lineWidth = 1;
                ctx.stroke();

                // 鱼尾巴
                const tailWagOffset = Math.sin(this.tailWag) * this.size * 0.1;
                ctx.beginPath();
                ctx.moveTo(-this.size * 0.7, 0);
                ctx.quadraticCurveTo(
                    -this.size * 1.2, -this.size * 0.4 + tailWagOffset,
                    -this.size * 1.5, -this.size * 0.3 + tailWagOffset
                );
                ctx.quadraticCurveTo(
                    -this.size * 1.3, 0,
                    -this.size * 1.5, this.size * 0.3 - tailWagOffset
                );
                ctx.quadraticCurveTo(
                    -this.size * 1.2, this.size * 0.4 - tailWagOffset,
                    -this.size * 0.7, 0
                );
                ctx.fillStyle = '#42a5f5';
                ctx.fill();

                // 背鳍
                ctx.beginPath();
                ctx.moveTo(0, -this.size * 0.45);
                ctx.quadraticCurveTo(
                    -this.size * 0.3, -this.size * 0.8,
                    -this.size * 0.1, -this.size * 0.6
                );
                ctx.lineTo(0, -this.size * 0.45);
                ctx.fillStyle = '#42a5f5';
                ctx.fill();

                // 侧鳍
                ctx.beginPath();
                ctx.ellipse(
                    this.size * 0.1, 
                    this.size * 0.35, 
                    this.size * 0.2, 
                    this.size * 0.1, 
                    Math.PI * 0.3, 
                    0, 
                    Math.PI * 2
                );
                ctx.fillStyle = '#42a5f5';
                ctx.fill();

                // 眼睛
                ctx.beginPath();
                ctx.arc(this.size * 0.4, -this.size * 0.15, this.size * 0.15, 0, Math.PI * 2);
                ctx.fillStyle = 'white';
                ctx.fill();
                ctx.strokeStyle = '#333';
                ctx.lineWidth = 1;
                ctx.stroke();

                // 瞳孔
                ctx.beginPath();
                ctx.arc(this.size * 0.45, -this.size * 0.15, this.size * 0.08, 0, Math.PI * 2);
                ctx.fillStyle = '#333';
                ctx.fill();

                // 眼睛高光
                ctx.beginPath();
                ctx.arc(this.size * 0.48, -this.size * 0.18, this.size * 0.03, 0, Math.PI * 2);
                ctx.fillStyle = 'white';
                ctx.fill();

                // 嘴巴
                ctx.beginPath();
                ctx.arc(this.size * 0.65, 0, this.size * 0.1, -Math.PI * 0.3, Math.PI * 0.3);
                ctx.strokeStyle = '#0d47a1';
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.restore();
            }
        }

        // 敌人鱼类
        class EnemyFish {
            constructor(x, y, size, direction) {
                this.x = x;
                this.y = y;
                this.size = size;
                this.direction = direction;
                this.speed = 1.5 + Math.random() * 1.5;
                this.tailWag = Math.random() * Math.PI * 2;
                
                // 根据体型设置颜色
                this.color = this.getColorBySize();
                
                // 速度调整（大鱼更慢）
                const sizeRatio = this.size / CONFIG.playerMaxSize;
                this.speed *= (1.5 - sizeRatio);
            }

            getColorBySize() {
                const colors = [
                    { body: '#ff7043', dark: '#e64a19', light: '#ffab91' },
                    { body: '#66bb6a', dark: '#388e3c', light: '#a5d6a7' },
                    { body: '#ffa726', dark: '#f57c00', light: '#ffcc80' },
                    { body: '#ab47bc', dark: '#7b1fa2', light: '#ce93d8' },
                    { body: '#ef5350', dark: '#d32f2f', light: '#ef9a9a' },
                    { body: '#26c6da', dark: '#0097a7', light: '#80deea' }
                ];
                
                return colors[Math.floor(Math.random() * colors.length)];
            }

            update(deltaTime, canvas) {
                // 移动
                this.x += Math.cos(this.direction) * this.speed;
                this.y += Math.sin(this.direction) * this.speed;

                // 尾巴摆动
                this.tailWag += 0.15;
            }

            isOutOfBounds(canvas) {
                const margin = this.size * 3;
                return this.x < -margin || 
                       this.x > canvas.width + margin ||
                       this.y < -margin || 
                       this.y > canvas.height + margin;
            }

            collidesWith(object) {
                const dx = this.x - object.x;
                const dy = this.y - object.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                const minDistance = (this.size + object.size) * 0.8;
                return distance < minDistance;
            }

            render(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.direction);

                // 鱼身体
                const bodyGradient = ctx.createRadialGradient(
                    -this.size * 0.2, -this.size * 0.2, 0,
                    0, 0, this.size
                );
                bodyGradient.addColorStop(0, this.color.light);
                bodyGradient.addColorStop(0.7, this.color.body);
                bodyGradient.addColorStop(1, this.color.dark);

                ctx.beginPath();
                ctx.ellipse(0, 0, this.size * 0.8, this.size * 0.5, 0, 0, Math.PI * 2);
                ctx.fillStyle = bodyGradient;
                ctx.fill();
                ctx.strokeStyle = this.color.dark;
                ctx.lineWidth = 1;
                ctx.stroke();

                // 鱼尾巴
                const tailWagOffset = Math.sin(this.tailWag) * this.size * 0.1;
                ctx.beginPath();
                ctx.moveTo(-this.size * 0.7, 0);
                ctx.quadraticCurveTo(
                    -this.size * 1.2, -this.size * 0.4 + tailWagOffset,
                    -this.size * 1.5, -this.size * 0.3 + tailWagOffset
                );
                ctx.quadraticCurveTo(
                    -this.size * 1.3, 0,
                    -this.size * 1.5, this.size * 0.3 - tailWagOffset
                );
                ctx.quadraticCurveTo(
                    -this.size * 1.2, this.size * 0.4 - tailWagOffset,
                    -this.size * 0.7, 0
                );
                ctx.fillStyle = this.color.light;
                ctx.fill();

                // 眼睛
                ctx.beginPath();
                ctx.arc(this.size * 0.4, -this.size * 0.15, this.size * 0.12, 0, Math.PI * 2);
                ctx.fillStyle = 'white';
                ctx.fill();
                ctx.strokeStyle = '#333';
                ctx.lineWidth = 1;
                ctx.stroke();

                // 瞳孔
                ctx.beginPath();
                ctx.arc(this.size * 0.44, -this.size * 0.15, this.size * 0.06, 0, Math.PI * 2);
                ctx.fillStyle = '#333';
                ctx.fill();

                ctx.restore();
            }
        }

        // 道具类
        class Powerup {
            constructor(x, y, type) {
                this.x = x;
                this.y = y;
                this.type = type; // 'speed' or 'shield'
                this.size = 20;
                this.lifetime = 15000; // 15秒后消失
                this.pulsePhase = 0;
                this.floatPhase = Math.random() * Math.PI * 2;
            }

            update(deltaTime) {
                this.lifetime -= deltaTime * 1000;
                this.pulsePhase += 0.1;
                this.floatPhase += 0.03;
            }

            render(ctx) {
                const pulse = 1 + Math.sin(this.pulsePhase) * 0.15;
                const float = Math.sin(this.floatPhase) * 5;

                ctx.save();
                ctx.translate(this.x, this.y + float);

                if (this.type === 'speed') {
                    // 加速泡泡 - 金色
                    const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, this.size * pulse);
                    gradient.addColorStop(0, 'rgba(255, 215, 0, 0.8)');
                    gradient.addColorStop(0.6, 'rgba(255, 193, 7, 0.5)');
                    gradient.addColorStop(1, 'rgba(255, 152, 0, 0.2)');

                    ctx.beginPath();
                    ctx.arc(0, 0, this.size * pulse, 0, Math.PI * 2);
                    ctx.fillStyle = gradient;
                    ctx.fill();

                    // 闪电图标
                    ctx.font = `bold ${this.size}px Arial`;
                    ctx.fillStyle = '#fff';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('⚡', 0, 0);

                } else {
                    // 护盾泡泡 - 蓝色
                    const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, this.size * pulse);
                    gradient.addColorStop(0, 'rgba(100, 181, 246, 0.8)');
                    gradient.addColorStop(0.6, 'rgba(33, 150, 243, 0.5)');
                    gradient.addColorStop(1, 'rgba(13, 71, 161, 0.2)');

                    ctx.beginPath();
                    ctx.arc(0, 0, this.size * pulse, 0, Math.PI * 2);
                    ctx.fillStyle = gradient;
                    ctx.fill();

                    // 护盾图标
                    ctx.font = `bold ${this.size}px Arial`;
                    ctx.fillStyle = '#fff';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('🛡️', 0, 0);
                }

                // 泡泡高光
                ctx.beginPath();
                ctx.arc(-this.size * 0.3 * pulse, -this.size * 0.3 * pulse, this.size * 0.2 * pulse, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
                ctx.fill();

                ctx.restore();
            }
        }

        // 粒子类
        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.size = 3 + Math.random() * 5;
                this.vx = (Math.random() - 0.5) * 8;
                this.vy = (Math.random() - 0.5) * 8;
                this.lifetime = 500 + Math.random() * 500;
                this.maxLifetime = this.lifetime;
            }

            update(deltaTime) {
                this.x += this.vx;
                this.y += this.vy;
                this.vx *= 0.95;
                this.vy *= 0.95;
                this.lifetime -= deltaTime * 1000;
            }

            render(ctx) {
                const alpha = this.lifetime / this.maxLifetime;
                const currentSize = this.size * alpha;

                ctx.save();
                ctx.globalAlpha = alpha;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, currentSize, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        // 初始化游戏
        const game = new Game();
    </script>
</body>
